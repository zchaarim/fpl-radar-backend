[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-radar-backend"
version = "0.1.0"
description = "FPL Radar backend: Ranking And Differential Analysis of Replacements."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "pydantic>=2.7",
  "pandas>=2.2",
  "beautifulsoup4>=4.12",
  "ortools>=9.10",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fpl-radar-backend = "fpl_radar.cli:main"
fpl-radar-api = "fpl_radar.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
